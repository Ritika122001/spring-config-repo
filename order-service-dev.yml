spring:
  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.LongSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  datasource:
    url: jdbc:h2:mem:ordersdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

  cloud:
    openfeign:
      circuitbreaker:
        enabled: false
    loadbalancer:
      retry:
        enabled: false

logging:
  level:
    io.github.resilience4j.retry: DEBUG
    io.github.resilience4j.circuitbreaker: DEBUG
    org.springframework.cache: TRACE

resilience4j:
  circuitbreaker:
    instances:
      itemBreaker:
        slidingWindowSize: 2
        minimumNumberOfCalls: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        ignoreExceptions:
          - com.example.order.exceptions.ItemNotFoundException
          - feign.FeignException.NotFound

  retry:
    instances:
      itemRetry:
        maxAttempts: 3
        waitDuration: 500ms
        ignoreExceptions:
          - com.example.order.exceptions.ItemNotFoundException
          - feign.FeignException.NotFound
          
  timelimiter:
    instances:
      itemService:
        timeoutDuration: 2s
        
management:
  endpoints:
    web:
      exposure:
        include: refresh,health,info
